[workspace]
resolver = "2"
members = [
    "crates/q-core",
    "crates/q-platform",
    "crates/q-tui",
    "crates/q-cli",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT"
repository = "https://github.com/2bb-dev/q"

[workspace.dependencies]
# Core
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "1"
anyhow = "1.0.103"
uuid = { version = "1", features = ["v4", "serde"] }
chrono = { version = "0.4", features = ["serde"] }
deunicode = "1"
any_ascii = "0.3"

# CLI
clap = { version = "4", features = ["derive"] }

# Platform
arboard = "3"
fd-lock = "4"
directories = "5"
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "gif", "webp"] }

# TUI
ratatui = { version = "0.30", default-features = false, features = ["crossterm", "underline-color"] }
ratatui-textarea = { version = "0.9", default-features = false }
crossterm = "0.29"
unicode-segmentation = "1"
unicode-width = "0.2"

# Dev
assert_cmd = "2"
predicates = "3"
tempfile = "3"
